# config/packages/messenger.yaml
framework:
    messenger:
        transports:
            async:
                dsn: dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: async_exchange
                        type: direct
                    queues:
                        async_messages: ~
        
        routing:
            'App\Message\UserMessage': async
