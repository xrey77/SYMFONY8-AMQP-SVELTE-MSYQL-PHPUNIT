security:
    password_hashers:
        App\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'
            cost:      15
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        
        product_report_public:
            pattern: ^/api/productreport|api/chartdata
            security: false   

        api:
            pattern:   ^/api
            stateless: true
            jwt: ~
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            json_login:
                check_path: /api/login_check # The route the SPA will POST to
                username_path: username      # Key in the JSON payload for the username
                password_path: password      # Key in the JSON payload for the         
            logout:
                path: app_logout
                target: app_home 

            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/register, roles: PUBLIC_ACCESS  }
        - { path: ^/api/login, roles: PUBLIC_ACCESS  }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS  }
        - { path: ^/api/addproduct, roles: PUBLIC_ACCESS  }
        - { path: ^/api/productlist, roles: PUBLIC_ACCESS  }
        - { path: ^/api/productsearch, roles: PUBLIC_ACCESS  }
        - { path: ^/api/productreport, roles: PUBLIC_ACCESS  }
        - { path: ^/api/report/product, roles: PUBLIC_ACCESS  }
        - { path: ^/api/chartdata, roles: PUBLIC_ACCESS  }

        - { path: ^/api/getuserid, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/getallusers, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/activationmfa, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/changeuserpassword, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/updateprofile, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/uploadpicture, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/otpvalidation, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }                        
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/, roles: PUBLIC_ACCESS  }                